{% extends "base.html" %}
{% block title %}Register - Health Risk Prediction System{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="auth-card animate-fade">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus auth-icon"></i>
                        <h3 class="fw-bold mt-2">Create Account</h3>
                        <p class="text-muted">Join HealthRisk AI today</p>
                    </div>
                    <form method="POST" action="{{ url_for('register') }}" novalidate id="registerForm">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" required minlength="2" placeholder="John Doe">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" required placeholder="you@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required minlength="6" placeholder="Min 6 characters">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" required minlength="6" placeholder="Confirm password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Register</button>
                        <p class="text-center mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
