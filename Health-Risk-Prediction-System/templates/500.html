{% extends "base.html" %}
{% block title %}500 - Server Error{% endblock %}

{% block content %}
<section class="error-section">
    <div class="container text-center py-5">
        <div class="error-code text-danger">500</div>
        <h2 class="fw-bold mt-3">Internal Server Error</h2>
        <p class="text-muted lead">Something went wrong on our end. Please try again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg mt-3"><i class="bi bi-house me-2"></i>Go Home</a>
    </div>
</section>
{% endblock %}
