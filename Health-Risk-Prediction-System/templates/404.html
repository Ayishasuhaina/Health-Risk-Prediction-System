{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<section class="error-section">
    <div class="container text-center py-5">
        <div class="error-code">404</div>
        <h2 class="fw-bold mt-3">Page Not Found</h2>
        <p class="text-muted lead">The page you are looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg mt-3"><i class="bi bi-house me-2"></i>Go Home</a>
    </div>
</section>
{% endblock %}
