{% extends "base.html" %}
{% block title %}Contact - Health Risk Prediction System{% endblock %}

{% block content %}
<section class="page-section">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="text-center mb-5">
                    <h1 class="fw-bold">Contact Us</h1>
                    <p class="lead text-muted">We'd love to hear from you</p>
                </div>
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="content-card text-center h-100">
                            <i class="bi bi-envelope contact-icon text-primary"></i>
                            <h6 class="mt-3">Email</h6>
                            <p class="text-muted mb-0">support@healthrisk.ai</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="content-card text-center h-100">
                            <i class="bi bi-telephone contact-icon text-success"></i>
                            <h6 class="mt-3">Phone</h6>
                            <p class="text-muted mb-0">+1 (800) 555-0199</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="content-card text-center h-100">
                            <i class="bi bi-geo-alt contact-icon text-danger"></i>
                            <h6 class="mt-3">Address</h6>
                            <p class="text-muted mb-0">123 Health Tech Park, Medical City</p>
                        </div>
                    </div>
                </div>

                <div class="content-card mt-4">
                    <h5 class="mb-4">Send us a Message</h5>
                    <form method="POST" action="{{ url_for('contact') }}" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Name</label>
                                <input type="text" name="name" class="form-control" required minlength="2">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Message</label>
                                <textarea name="message" class="form-control" rows="5" required minlength="10"></textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i> Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
